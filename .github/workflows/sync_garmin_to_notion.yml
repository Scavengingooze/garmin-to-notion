name: Sync Garmin to Notion

on:
  schedule:
    - cron: '11 3 * * *' # Daily at 03:11 Switzerland time
  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 10
env:
  TZ: 'Europe/Zurich'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync
        
      - name: Show GarminConnect version
        run: uv run python -c "import importlib.metadata; print(importlib.metadata.version('garminconnect'))"

      - name: Run script
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_PR_DB_ID: ${{ secrets.NOTION_PR_DB_ID }}
          NOTION_STEPS_DB_ID: ${{ secrets.NOTION_STEPS_DB_ID }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          NOTION_CALORIES_DB_ID: ${{ secrets.NOTION_CALORIES_DB_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '10' }}
          TZ: 'Europe/Zurich'
        run: |
          uv run python -m src.workflows.daily-steps
          uv run python -m src.workflows.sleep-data
          uv run python -m src.workflows.calories-data
